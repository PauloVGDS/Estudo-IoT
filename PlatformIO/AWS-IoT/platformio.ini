; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = Projeto para testar as funcionalidades AWS com ESP32
; Conexão com AWS IoT Core
; Autenticação com certificados
; Sincronização SNTP
; Envio de JSON por MQTT a banco de dados
; Leitura de Temperatura por sensor MPU6050
; Exibição dos dados por display SSD1306 e gráficos no Grafana

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time
build_flags = -DCORE_DEBUG_LEVEL=3
board_build.partitions = default.csv
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit SSD1306@^2.5.15
